const qs=[{"stage":"入场候考","tag":"认识情绪","q":"我已做好准备，仍有些紧张。怎样看待？","options":["紧张就说明我考不好","适度紧张可能提醒我做好准备，可以专注当前任务","必须完全不紧张才能测试"],"correct":1,"why":"适度紧张可能提醒我们做好准备。承认当下的感受，把注意力放回当前任务，不必等到完全不紧张才参与。","note":"情绪调节有助于合理应对，不保证测试分数。","branches":["把紧张直接看作失败的信号，推断缺少依据。","允许适度紧张存在，同时关注当前准备，选择有依据。","把“完全不紧张”设为测试前提，容易过分关注紧张本身。"]},{"stage":"立定跳远结束","tag":"考完一项，关注下一项","q":"立定跳远测试结束，成绩未达自己的预期，我感到失落。怎样应对更合适？","options":["“后面也肯定考不好”","“这一项已经结束，先放下对结果的纠结，把注意力放到接下来的测试”","我沮丧地反复抱怨"],"correct":1,"why":"可以承认失落，同时把注意力转向接下来的任务。一项未达预期，不能证明后面都考不好；反复抱怨也不利于当前准备。","note":"这里的“放下”是暂时不纠缠结果，不要求忘记失误或立刻开心。情境不设置具体成绩和达标标准。","branches":["把一项结果扩大成对后续全部测试的确定预判，需要核对依据。","接受这一项已经结束，把注意力放到能够准备的当前任务，选择合理。","失落可以理解；反复抱怨是可以调整的行为，不必责备自己有失落情绪。"]},{"stage":"耐久跑候考","tag":"想法与行动分开","q":"接下来进行耐久跑测试，候考时哪种想法更合理？","options":["“跳远没达目标，耐久跑肯定也不行”","“只要不紧张，耐久跑就一定满分”","“上一项未达目标，不等于耐久跑也跑不好”"],"correct":2,"why":"③承认上一项的事实，也为后续表现保留可能。①将单项结果扩大化，②把情绪调节当成得分保证，都缺少依据。","note":"另补一个具体行动：如听清指令、结合自身能力合理安排耐久跑节奏。想法和行动分开写。","branches":["不同项目有不同要求，不能凭跳远一项结果断定耐久跑表现。","情绪只是影响因素之一，不紧张也不能保证满分。","这一认识符合已有事实，能帮助把注意力放回接下来的任务。"]},{"stage":"全部测试结束","tag":"选择合适行动","q":"我仍对表现有些遗憾。怎样做更合适？","options":["马上加练到筋疲力尽惩罚自己","承认失落，按要求做好整理与恢复，稍后复盘，需要时找信任的人交流","强迫自己马上开心"],"correct":1,"why":"可以承认失落，同时按要求整理、恢复，稍后复盘并寻求支持。不需要用惩罚性运动或强迫开心应对。","note":"按身体状况和现场要求恢复。困扰持续影响学习生活时，告诉家长、老师。","branches":["加练到筋疲力尽会增加负荷，不能作为惩罚情绪的方式。","兼顾感受、身体恢复和后续支持，选择适宜。","强迫开心容易否认真实感受。先承认情绪，再选择合适方法。"]}];

function hero(host,complete=false){let live=true,start=performance.now(),raf;const r=svgEl('svg',{viewBox:'0 0 600 620',role:'img','aria-label':complete?'考生缓步整理，准备将方法带回运动':'考生等待入场，觉察自己的情绪'},host);r.innerHTML='<ellipse cx="300" cy="340" rx="241" ry="241" fill="#dce9dc"/><path d="M78 539Q300 508 522 539" fill="none" stroke="#6c9182" stroke-width="4"/>';const a=actor(r,'hero-candidate',{scale:1.68});function draw(now){if(!live)return;let t=(now-start)/1000,p=complete?walkPose(285+Math.sin(t*.22)*21,556,t,.18):{x:300,y:556,head:Math.sin(t*.6)*2,arm:[7+Math.sin(t)*2,-10],elbow:[-25,-12],leg:[0,0],knee:[0,0],breath:Math.sin(t*1.6)*1.3,mood:'concern'};drawActor(a,p,t);if(!matchMedia('(prefers-reduced-motion:reduce)').matches)raf=requestAnimationFrame(draw);}draw(start);return()=>{live=false;cancelAnimationFrame(raf);};}
function cleanupHero(){if(heroStop){heroStop();heroStop=null;}}
function render(){cleanupHero();if(index<0){player.stop();nav.innerHTML='';app.innerHTML=`<section class="welcome"><div class="welcome-panel"><div id="hero" class="hero"></div><button class="primary hero-button" id="begin" type="button">进入体育中考　→</button></div><div class="outcome-panel"><p class="intro-kicker">四个时刻，四次选择</p><h2 class="intro-title">面对紧张与失落，<br>我可以怎样应对？</h2><p class="intro-body">带着自己的感受出发，<br>为想法和行动作一次选择。</p><div class="journey"><span>入场候考</span><span>跳远结束</span><span>耐久跑候考</span><span>测试结束</span></div><p class="guide">先作出选择，再说说你的想法。</p></div></section>`;heroStop=hero(document.getElementById('hero'));document.getElementById('begin').onclick=()=>{armAudio();index=0;render();window.scrollTo(0,0);};return;}
 if(index===4){player.stop();nav.innerHTML='';app.innerHTML=`<section class="outcome"><div class="welcome-panel"><div id="hero" class="hero"></div><button class="primary hero-button" id="again" type="button">再体验一次</button></div><div class="outcome-panel"><p class="intro-kicker">四个情境已完成</p><h2>把方法带回下一次运动</h2><div class="takeaway"><strong>认识情绪</strong><p>觉察运动前后的情绪感受和身体信号。</p></div><div class="takeaway"><strong>接纳情绪</strong><p>情绪没有好坏之分，不强迫自己马上开心。</p></div><div class="takeaway"><strong>主动管理情绪</strong><p>运用合理想法、适宜运动与放松方法，帮助自己调整状态。</p></div><div class="recall">${qs.map((q,i)=>`<button type="button" data-review="${i}">回看：${q.stage}</button>`).join('')}</div><p class="guide">填写导学案：记录选择与调节方法。</p></div></section>`;heroStop=hero(document.getElementById('hero'),true);document.getElementById('again').onclick=reset;app.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>visit(Number(b.dataset.review)));return;}
 const q=qs[index],checked=records[index]!==null;selected=records[index]?.choice??null;
 nav.innerHTML=qs.map((q,i)=>`<button type="button" data-stage="${i}" ${i===index?'aria-current="step"':''} ${i>index&&records[i]===null?'disabled':''}>${['入场候考','跳远结束','耐久跑候考','测试结束'][i]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>visit(Number(b.dataset.stage)));
 app.innerHTML=`<main><section class="scene" aria-label="${q.stage}情境动画"><div class="scene-head"><h2>${q.stage}</h2><span class="scene-label">情境动画</span></div><div class="stage" id="sceneStage"></div><div class="scene-progress"><span id="sceneProgress"></span></div><div class="scene-controls"><button type="button" id="pauseScene" aria-pressed="false">暂停动画</button><button type="button" id="replayScene">重播情境</button><span class="motion-hint">可暂停后讨论</span></div><div class="scene-caption"><p id="sceneThought" class="mobile-thought"></p><p id="sceneNarration" aria-live="polite"></p></div></section><section class="paper"><p class="tag">第${index+1}题 / 共4题　${q.tag}</p><h2 id="question">${esc(q.q)}</h2><div class="options" role="radiogroup" aria-labelledby="question">${q.options.map((o,i)=>`<button class="option ${checked&&i===q.correct?'correct':checked&&i===selected?'wrong':''}" type="button" role="radio" aria-checked="${selected===i}" data-option="${i}"><span class="letter">${labels[i]}</span><span>${esc(o)}</span>${checked&&(i===q.correct||i===selected)?`<span class="mark" aria-hidden="true">${i===q.correct?'✓':'○'}</span>`:''}</button>`).join('')}</div>${checked?`<section class="feedback ${selected===q.correct?'':'reconsider'}" aria-live="polite"><h2>${selected===q.correct?'这个选择有助于调节情绪':'再想想怎样调整'} <small>参考选择${labels[q.correct]}</small></h2><p>${esc(q.branches[selected])}</p><p>${esc(q.why)}</p><p class="note">${esc(q.note)}</p></section>`:''}<div class="actions"><button type="button" class="primary" id="next" ${!checked?'disabled':''}>${index===3?'完成体验　→':'下一情境　→'}</button></div><p class="guide">填写导学案：记录选择与调节方法${index===2?'，另补一种行动':''}</p></section></main>`;
 player.mount(document.getElementById('sceneStage'),index,selected,checked);app.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.option)));document.getElementById('next').onclick=next;
}
function choose(n){if(index<0||index>3)return;records[index]={choice:n};selected=n;const kind=n===qs[index].correct?'correct':'reconsider';render();chime(kind);app.querySelector(`[data-option="${n}"]`)?.focus({preventScroll:true});}
function visit(n){stopFeedback();index=n;render();window.scrollTo({top:0,behavior:'instant'});}
function next(){if(index<0||index>3||records[index]===null)return;stopFeedback();index++;render();if(index===4)chime('complete');window.scrollTo({top:0,behavior:'instant'});}
function reset(){stopFeedback();player.stop();player.stage=-1;player.key=null;player.mode='observe';index=-1;selected=null;records=Array(4).fill(null);render();window.scrollTo({top:0,behavior:'instant'});}
document.getElementById('restart').onclick=reset;document.getElementById('sound').onclick=async()=>{audioState.enabled=!audioState.enabled;if(!audioState.enabled)stopFeedback();document.getElementById('sound').textContent=audioState.enabled?'声音已开':'声音已关';document.getElementById('sound').setAttribute('aria-pressed',String(audioState.enabled));if(audioState.enabled)await armAudio();};
document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch{document.getElementById('fullscreen').textContent='可用浏览器全屏';}};
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select'))return;if(index<0||index===4)return;if(['1','2','3'].includes(e.key)){e.preventDefault();choose(Number(e.key)-1);}else if(e.key==='ArrowRight'){e.preventDefault();next();}});window.addEventListener('resize',()=>player.fitViewport());
document.getElementById('printQuestions').innerHTML='<h1>主动管理情绪 体育中考情境练习</h1>'+qs.map((q,i)=>`<section><h2>${i+1}. ${esc(q.q)}</h2>${q.options.map((o,j)=>`<p>${labels[j]} ${esc(o)}</p>`).join('')}<p>选择：____　理由：____________________________________</p></section>`).join('');render();

</script></body></html>
